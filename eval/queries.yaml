# Evaluation queries for retrieval over the PyTorch docs corpus (docs 2.14.0 + tutorials).
#
# Relevance judgments are HUMAN-WRITTEN. Every `judgments` list below is intentionally
# empty; fill them in by hand before any retriever is tuned against this file.
#
# Judgment unit: a page URL (as stored in data/corpus.db, i.e. the versioned
# https://docs.pytorch.org/docs/2.14/... form or https://docs.pytorch.org/tutorials/...),
# optionally narrowed to a section with `anchor` (the section id / API object id, e.g.
# "torch.nn.Linear.forward"). Grades:
#   2 = directly answers the query (the page/section you would send someone to)
#   1 = partially answers or is closely related (useful context, or answers a sub-part)
#   0 = judged and NOT relevant (record these too: they are the pooled negatives)
# Anything not listed is treated as grade 0 by the metrics. Aim for at least one grade-2
# judgment per query; multi_hop queries usually need two or more grade-2 pages.
#
# Example:
#   judgments:
#     - {url: https://docs.pytorch.org/docs/2.14/generated/torch.nn.Linear.html, grade: 2}
#     - {url: https://docs.pytorch.org/docs/2.14/nn.html, anchor: linear-layers, grade: 1}
#
# Categories:
#   api_lookup  - a specific function/class/argument; the API reference page is the target
#   conceptual  - explains a mechanism or a "why"; notes/user-guide prose is the target
#   multi_hop   - needs information from two or more pages to answer fully
#   tutorial    - a how-do-I task whose best answer is a tutorial/recipe, not an API page

